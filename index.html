<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculadora">
    <h1>Mi Calculadora</h1>

    <div class="pantalla">
      <div id="operacion-anterior" class="operacion-anterior"></div>
      <div id="pantalla-principal" class="pantalla-principal">0</div>
    </div>

    <div class="teclado">
      <button class="btn btn-funcion" data-accion="limpiar">C</button>
      <button class="btn btn-funcion" data-accion="borrar">⌫</button>
      <button class="btn btn-funcion" data-accion="porcentaje">%</button>
      <button class="btn btn-operador" data-accion="dividir">÷</button>

      <button class="btn btn-numero" data-numero="7">7</button>
      <button class="btn btn-numero" data-numero="8">8</button>
      <button class="btn btn-numero" data-numero="9">9</button>
      <button class="btn btn-operador" data-accion="multiplicar">×</button>

      <button class="btn btn-numero" data-numero="4">4</button>
      <button class="btn btn-numero" data-numero="5">5</button>
      <button class="btn btn-numero" data-numero="6">6</button>
      <button class="btn btn-operador" data-accion="restar">−</button>

      <button class="btn btn-numero" data-numero="1">1</button>
      <button class="btn btn-numero" data-numero="2">2</button>
      <button class="btn btn-numero" data-numero="3">3</button>
      <button class="btn btn-operador" data-accion="sumar">+</button>

      <button class="btn btn-numero btn-cero" data-numero="0">0</button>
      <button class="btn btn-numero" data-numero=".">.</button>
      <button class="btn btn-igual" data-accion="igual">=</button>
    </div>

    <section class="historial">
      <div class="historial-header">
        <h2>Historial</h2>
        <button id="limpiar-historial" class="btn-limpiar-historial">Vaciar</button>
      </div>
      <ul id="lista-historial" class="lista-historial"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
